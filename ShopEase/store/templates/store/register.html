{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | ShopEase</title>

    <link rel="stylesheet"
          href="{% static 'store/css/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🛍️ ShopEase
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="{% url 'cart' %}">
                🛒 Cart
            </a>

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </nav>


    <section class="auth-section">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p>Join ShopEase and start shopping.</p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </p>

        </div>

    </section>

</body>
</html>
